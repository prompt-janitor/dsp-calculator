<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><rect x="2.5" y="4" width="6" height="5" rx="1.2"/><rect x="2.5" y="15" width="6" height="5" rx="1.2"/><rect x="15.5" y="9.5" width="6" height="5" rx="1.2"/><path d="M8.5 6.5c4 0 3 5.5 7 5.5M8.5 17.5c4 0 3-5.5 7-5.5"/></symbol>
    <symbol id="i-build" viewBox="0 0 24 24"><path d="M3 20.5V10l5 3V10l5 3V6.5l8 4v10z"/><path d="M3 20.5h18M7 17h2M12 17h2M17 17h2"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <symbol id="i-saved" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17L12 16.5l-5.5 4z"/></symbol>
    <symbol id="i-files" viewBox="0 0 24 24"><path d="M8 3.5v13M4.5 13 8 16.5l3.5-3.5M16 20.5v-13M12.5 11 16 7.5l3.5 3.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M8 11H6a1.5 1.5 0 0 0-1.5 1.5v7A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 18 11h-2"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 9 4.5-9 4.5L3 8z"/><path d="m3 12.5 9 4.5 9-4.5M3 16.5l9 4.5 9-4.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><rect x="4.5" y="11" width="15" height="10" rx="2"/></symbol>
    <symbol id="mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6.5" fill="none" stroke="var(--accent)" stroke-width="2"/><ellipse cx="16" cy="16" rx="14" ry="5.5" transform="rotate(-24 16 16)" fill="none" stroke="var(--warm)" stroke-width="1.6"/><circle cx="26.2" cy="11.2" r="2" fill="var(--warm)"/></symbol>
  </defs>
</svg>

<div class="app" id="app" data-tab="plan" data-side="plan" data-main="map" data-bsec="buildings">
  <aside class="side">
    <header class="wide-head side-head">
      <div class="brand"><svg aria-hidden="true"><use href="#mark"/></svg><b>DSP Calculator</b></div>
    </header>
    <div class="side-tabs"><div class="seg full" role="tablist" aria-label="Sidebar" id="sideTabs">
      <button type="button" role="tab" id="stab-plan" data-side="plan" aria-controls="pane-plan" aria-selected="true"><svg class="svgi" aria-hidden="true"><use href="#i-plan"/></svg>Plan</button>
      <button type="button" role="tab" id="stab-saved" data-side="saved" aria-controls="pane-saved" aria-selected="false" tabindex="-1"><svg class="svgi" aria-hidden="true"><use href="#i-saved"/></svg>Saved</button>
      <button type="button" role="tab" id="stab-files" data-side="files" aria-controls="pane-files" aria-selected="false" tabindex="-1"><svg class="svgi" aria-hidden="true"><use href="#i-files"/></svg>Load/<wbr>Save</button>
      <button type="button" role="tab" id="stab-settings" data-side="settings" aria-controls="pane-settings" aria-selected="false" tabindex="-1"><svg class="svgi" aria-hidden="true"><use href="#i-set"/></svg>Settings</button>
    </div></div>
    <header class="phone-head plan-head"><h1><span id="planTitle">Plan</span><span class="sub" id="planSub">What do you want to make?</span></h1>
      <button class="btn round" type="button" data-act="share" aria-label="Share plan"><svg class="svgi" aria-hidden="true"><use href="#i-share"/></svg></button></header>
    <div class="segbar plan-segs"><div class="seg full" role="tablist" aria-label="Plan section" id="planTabs">
      <button type="button" role="tab" id="ptab-plan" data-psec="plan" aria-controls="pane-plan" aria-selected="true">Plan</button>
      <button type="button" role="tab" id="ptab-saved" data-psec="saved" aria-controls="pane-saved" aria-selected="false" tabindex="-1">Saved</button>
      <button type="button" role="tab" id="ptab-files" data-psec="files" aria-controls="pane-files" aria-selected="false" tabindex="-1">Load/Save</button>
    </div></div>
    <section class="pane" id="pane-plan" role="tabpanel" aria-label="Plan">
      <div class="pane-body" id="planBody"></div>
    </section>
    <section class="pane" id="pane-saved" role="tabpanel" aria-label="Saved plans">
      <div class="pane-body" id="savedBody"></div>
    </section>
    <section class="pane" id="pane-files" role="tabpanel" aria-label="Load and save">
      <div class="pane-body" id="filesBody"></div>
    </section>
    <section class="pane" id="pane-settings" role="tabpanel" aria-label="Settings">
      <header class="phone-head"><h1>Settings<span class="sub">Tiers, belts and research</span></h1></header>
      <div class="pane-body" id="setBody"></div>
    </section>
  </aside>

  <main class="main">
    <header class="wide-head main-head">
      <div class="seg" role="tablist" aria-label="View" id="mainTabs">
        <button type="button" role="tab" id="mtab-map" data-main="map" aria-controls="pane-map" aria-selected="true">Flow map</button>
        <button type="button" role="tab" id="mtab-build" data-main="build" aria-controls="pane-build" aria-selected="false" tabindex="-1">Build list</button>
      </div>
      <div class="mini" id="miniStats"></div>
      <button class="btn" type="button" data-act="share"><svg class="svgi s20" aria-hidden="true"><use href="#i-share"/></svg>Share</button>
    </header>

    <section class="pane" id="pane-map" role="tabpanel" aria-label="Flow map">
      <div class="vpwrap">
        <div class="viewport" id="viewport"><div class="stage" id="stage"></div></div>
        <div class="mapbar">
          <div class="pill title"><b>Flow map</b><small id="mapSub"></small></div>
          <span class="sp"></span>
          <button class="btn round" type="button" id="btnLayers" aria-label="Map options" aria-expanded="false"><svg class="svgi" aria-hidden="true"><use href="#i-layers"/></svg></button>
        </div>
        <div class="pill layers" id="layers" hidden>
          <label class="togrow"><span>Rates on links</span><input class="switch" type="checkbox" id="optLabels" checked></label>
          <label class="togrow"><span>Proliferator links</span><input class="switch" type="checkbox" id="optSpray" checked></label>
          <div class="legend">
            <span><i style="background:var(--c-smelter)"></i>Smelter</span><span><i style="background:var(--c-assembler)"></i>Assembler</span>
            <span><i style="background:var(--c-chem)"></i>Chemical</span><span><i style="background:var(--c-lab)"></i>Lab</span><span><i style="background:var(--c-source)"></i>Extraction</span>
          </div>
        </div>
        <div class="zoombar">
          <button class="btn round" type="button" id="zin" aria-label="Zoom in"><svg class="svgi" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button class="btn round" type="button" id="zout" aria-label="Zoom out"><svg class="svgi" aria-hidden="true"><use href="#i-minus"/></svg></button>
          <button class="btn round" type="button" id="zfit" aria-label="Fit whole map"><svg class="svgi" aria-hidden="true"><use href="#i-fit"/></svg></button>
        </div>
        <div class="edgefade" id="edgeFade" hidden><button class="btn round" type="button" id="fitLeft" aria-label="Show the whole map"><svg class="svgi flip" aria-hidden="true"><use href="#i-chev"/></svg></button></div>
        <div class="empty" id="mapEmpty" hidden><div><b>Nothing to build yet</b>Add an item on the Plan tab.</div></div>
      </div>
    </section>

    <section class="pane" id="pane-build" role="tabpanel" aria-label="Build list">
      <header class="phone-head"><h1>Build<span class="sub" id="buildSub"></span></h1></header>
      <div class="segbar"><div class="seg full" role="tablist" aria-label="Build list section" id="buildTabs">
        <button type="button" role="tab" id="btab-buildings" data-bsec="buildings" aria-controls="bsec-buildings" aria-selected="true">Buildings</button>
        <button type="button" role="tab" id="btab-steps" data-bsec="steps" aria-controls="bsec-steps" aria-selected="false" tabindex="-1">Steps</button>
        <button type="button" role="tab" id="btab-resources" data-bsec="resources" aria-controls="bsec-resources" aria-selected="false" tabindex="-1">Resources</button>
      </div></div>
      <div class="pane-body" id="buildBody"></div>
    </section>
  </main>

  <div class="tabbar" role="tablist" aria-label="Sections" id="tabBar">
    <button type="button" role="tab" id="tab-plan" data-tab="plan" aria-controls="pane-plan" aria-selected="true"><svg class="svgi" aria-hidden="true"><use href="#i-plan"/></svg>Plan</button>
    <button type="button" role="tab" id="tab-map" data-tab="map" aria-controls="pane-map" aria-selected="false" tabindex="-1"><svg class="svgi" aria-hidden="true"><use href="#i-map"/></svg>Map</button>
    <button type="button" role="tab" id="tab-build" data-tab="build" aria-controls="pane-build" aria-selected="false" tabindex="-1"><svg class="svgi" aria-hidden="true"><use href="#i-build"/></svg>Build</button>
    <button type="button" role="tab" id="tab-settings" data-tab="settings" aria-controls="pane-settings" aria-selected="false" tabindex="-1"><svg class="svgi" aria-hidden="true"><use href="#i-set"/></svg>Settings</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet inspector" id="inspector" hidden role="dialog" aria-label="Step details" tabindex="-1">
  <div class="grab"><div class="sh-head" id="inspHead"></div></div>
  <div class="sh-body" id="inspBody"></div>
</section>

<section class="sheet picker" id="picker" hidden role="dialog" aria-modal="true" aria-label="Choose an item" tabindex="-1">
  <div class="grab">
    <div class="sh-head"><h3>Choose an item</h3><button class="btn plain" type="button" data-close="picker">Cancel</button></div>
    <div class="search"><svg class="svgi mut s18" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="pickSearch" placeholder="Search 170+ items" aria-label="Search items" autocomplete="off" enterkeyhint="search"></div>
    <div class="chips" id="pickCats" role="group" aria-label="Category"></div>
  </div>
  <div class="sh-body" id="pickGrid"></div>
</section>

<section class="sheet export" id="export" hidden role="dialog" aria-modal="true" aria-label="Share plan" tabindex="-1">
  <div class="grab">
    <div class="sh-head"><h3>Share plan</h3><button class="btn plain" type="button" data-close="export">Done</button></div>
    <div class="seg full gap-top" role="group" aria-label="Format"><button type="button" data-exp="summary" aria-pressed="true">Summary</button><button type="button" data-exp="code" aria-pressed="false">Plan code</button></div>
  </div>
  <div class="sh-body">
    <textarea id="expText" aria-label="Export text" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <p class="hintp" id="expHint"></p>
    <div class="sh-actions"><button class="btn primary" type="button" id="expCopy">Copy</button><button class="btn" type="button" id="expLink">Copy link</button><button class="btn" type="button" id="expShare" hidden>Share…</button><button class="btn" type="button" id="expLoad" hidden>Load</button></div>
    <p class="hintp" id="expMsg" role="status"></p>
  </div>
</section>

<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="planFile" accept=".json,application/json" hidden aria-hidden="true" tabindex="-1">
